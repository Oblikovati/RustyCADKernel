[package]
name = "rustycad-tktopalgo"
description = "OCCT TKTopAlgo toolkit: topological algorithms (classification, construction, checking, extrema and properties of shapes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.1.0" }
rustycad-tkmath = { path = "../tkmath", version = "0.1.0" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.1.0" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.1.0" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.1.0" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.1.0" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.1.0" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.1.0" }

[[example]]
name = "rustycad-tktopalgo-numeric-probe"
path = "examples/numeric_probe.rs"
