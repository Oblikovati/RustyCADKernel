name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_scope:
        description: Diagnostic-only Rust owner capture; release calls always run all owners
        type: choice
        options: [all, rust]
        default: all
        required: true
      source_ref:
        description: Optional immutable source revision for diagnostic dispatch
        type: string
        required: false
  workflow_call:
    inputs:
      source_ref:
        description: Exact source revision supplied by the release coordinator
        required: false
        type: string
permissions:
  contents: read
# Toolkit suites share test executables; symbols and incremental caches are unnecessary in CI.
# These settings keep debug assertions and optimization levels unchanged.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  # XR replay on run38200556316 exposed CPU-dependent bilinear sampling.
  # The checked native GL and lavapipe fixtures share Gallivm's SSE2 profile.
  GALLIUM_OVERRIDE_CPU_CAPS: sse2
  LP_NATIVE_VECTOR_WIDTH: '128'
  # LLVM merges counters into four files per binary rather than one file per process.
  LLVM_PROFILE_FILE_NAME: martensite-%4m.profraw
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # Porting is verified on the local Linux host; Windows/macOS validation is deferred.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
          python3 tools/with_vulkan_validation.py --github-env "$GITHUB_ENV"
      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf tcl-tk@8 freetype fontconfig
          tcl_prefix="$(brew --prefix tcl-tk@8)"
          shim_dir="$RUNNER_TEMP/martensite-pkgconfig"
          mkdir -p "$shim_dir"
          for module in tcl tk; do
            pc_file="$tcl_prefix/lib/pkgconfig/$module.pc"
            if [ ! -f "$pc_file" ]; then pc_file="$tcl_prefix/lib/pkgconfig/${module}8.6.pc"; fi
            cp "$pc_file" "$shim_dir/${module}8.6.pc"
          done
          echo "PKG_CONFIG_PATH=$shim_dir:$tcl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$tcl_prefix/lib:$(brew --prefix freetype)/lib:$(brew --prefix fontconfig)/lib" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$shim_dir:$tcl_prefix/lib/pkgconfig" pkg-config --modversion tcl8.6 tk8.6
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: tcltk/tcl
          ref: 515167c897a7c8066abfbd71e8fe7bd8bf3569de # Tcl 8.6.18
          path: target/tcl-source
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: tcltk/tk
          ref: 6dbe68819aac4a22f6f7a143133ce26c5e8d2b05 # Tk 8.6.18
          path: target/tk-source
      - name: Install Windows Tcl/Tk prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/install_windows_tcl.ps1
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: freetype/freetype
          ref: 0a0221a1347e2f1e07c395263540026e9a0aa7c7 # FreeType 2.14.3
          path: target/freetype-source
      - name: Install Windows FreeType prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/install_windows_freetype.ps1
      - run: rustup show
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate rust-prechecks
      - name: Test every toolkit (including doctests)
        id: rust_gate
        shell: bash
        run: |
          mkdir -p target/rust-gate
          printf 'Martensite original gate revision: %s\n' "$(git rev-parse HEAD)" > target/rust-gate/gate.log
          printf 'Martensite original gate command: cargo test-all --no-fail-fast\n' >> target/rust-gate/gate.log
          set +e
          set -o pipefail
          python3 target/verification-tools/tools/verify_release_gate.py --root . --gate rust-tests 2>&1 | tee -a target/rust-gate/gate.log
          gate_status=${PIPESTATUS[0]}
          printf '%s\n' "$gate_status" > target/rust-gate/gate.exit
          exit "$gate_status"
      - name: Check out current workspace-failure observation tools
        if: ${{ failure() && steps.rust_gate.outcome == 'failure' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic-tools
          persist-credentials: false
      - name: Record the original workspace gate without rerunning it
        if: ${{ failure() && steps.rust_gate.outcome == 'failure' }}
        run: |
          python3 diagnostic-tools/tools/diagnose_current_vulkan.py --root . --output target/rust-gate/evidence --revision "$(git rev-parse HEAD)" --phase record --profile workspace --gate-log target/rust-gate/gate.log --gate-exit target/rust-gate/gate.exit
      - name: Install post-failure workspace observation tooling
        if: ${{ failure() && steps.rust_gate.outcome == 'failure' }}
        run: sudo apt-get install -y vulkan-tools
      - name: Retain actual workspace-feature raw controls and original binary replay
        if: ${{ failure() && steps.rust_gate.outcome == 'failure' }}
        run: |
          python3 diagnostic-tools/tools/diagnose_current_vulkan.py --root . --output target/rust-gate/evidence --revision "$(git rev-parse HEAD)" --phase observe --profile workspace
      - name: Upload failed workspace gate and post-gate evidence
        if: ${{ always() && steps.rust_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rust-workspace-gate-failure
          path: |
            target/rust-gate/gate.log
            target/rust-gate/gate.exit
            target/rust-gate/evidence/*.json
            target/rust-gate/evidence/*.log
            target/rust-gate/evidence/*.stdout
            target/rust-gate/evidence/*.stderr
            target/rust-gate/evidence/*.rgba
            target/rust-gate/evidence/*.depth
          if-no-files-found: error
      - run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate rust-docs
  coverage:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_scope != 'rust' }}
    runs-on: ubuntu-latest
    steps:
      # Leave space for instrumented toolkits and the source-built coverage tools.
      - name: Free unused hosted SDKs for instrumented tests
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install native coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
          python3 tools/with_vulkan_validation.py --github-env "$GITHUB_ENV"
      - run: rustup show
      - run: cargo install cargo-nextest --version 0.9.148 --locked
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      # Run 38156653032 timed out in Bug30655's 211k-triangle sphere workload.
      # The functional toolkit suite keeps it; coverage avoids the duplicate dense replay.
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - name: Run instrumented tests once, with coverage and JUnit output
        run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate coverage
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-and-tests
          path: |
            target/lcov.info
            target/nextest/ci/junit.xml
  vulkan-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_scope != 'rust' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools xvfb xauth
      - name: Select the verified parallel-safe validation layer
        run: python3 tools/with_vulkan_validation.py --github-env "$GITHUB_ENV"
      - name: Select the installed software Vulkan ICD
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - name: Run the original cold Vulkan gate
        id: vulkan_gate
        shell: bash
        run: |
          mkdir -p target/vulkan-gate
          printf 'Martensite original gate revision: %s\n' "$(git rev-parse HEAD)" > target/vulkan-gate/gate.log
          printf 'Martensite original gate command: cargo test -p martensite-vulkan --all-targets --locked\n' >> target/vulkan-gate/gate.log
          set +e
          set -o pipefail
          python3 target/verification-tools/tools/verify_release_gate.py --root . --gate vulkan-cold 2>&1 | tee -a target/vulkan-gate/gate.log
          gate_status=${PIPESTATUS[0]}
          printf '%s\n' "$gate_status" > target/vulkan-gate/gate.exit
          exit "$gate_status"
      # Current orchestration tools must not come from an older source_ref release tag.
      - name: Check out post-failure observation tools
        if: ${{ failure() && steps.vulkan_gate.outcome == 'failure' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: diagnostic-tools
          persist-credentials: false
      - name: Record the original failed gate without rerunning it
        if: ${{ failure() && steps.vulkan_gate.outcome == 'failure' }}
        run: |
          python3 diagnostic-tools/tools/diagnose_current_vulkan.py --root . --output target/vulkan-gate/evidence --revision "$(git rev-parse HEAD)" --phase record --gate-log target/vulkan-gate/gate.log --gate-exit target/vulkan-gate/gate.exit
      - name: Install observation tools after the failed cold gate
        if: ${{ failure() && steps.vulkan_gate.outcome == 'failure' }}
        run: sudo apt-get install -y vulkan-tools
      - name: Capture post-failure driver identities and raw strict controls
        if: ${{ failure() && steps.vulkan_gate.outcome == 'failure' }}
        run: |
          python3 diagnostic-tools/tools/diagnose_current_vulkan.py --root . --output target/vulkan-gate/evidence --revision "$(git rev-parse HEAD)" --phase observe
      - name: Upload the original failed gate and subsequent evidence
        if: ${{ always() && steps.vulkan_gate.outcome == 'failure' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vulkan-cold-gate-failure
          path: target/vulkan-gate
          if-no-files-found: error
      - name: Validate offscreen and opaque/clipped lighting on lavapipe
        run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate vulkan-acceptance
      - name: Validate every checked-in Vulkan shader variant
        run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate vulkan-shaders
      - name: Measure release renderer performance on lavapipe
        run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate vulkan-performance
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lavapipe-renderer-performance
          path: target/renderer-performance.log
  dependencies:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_scope != 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: rustup show
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate dependencies
  inventory:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_scope != 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate inventory
  tools:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.check_scope != 'rust' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Check out current shared verification tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: target/verification-tools
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            tools/release_verification_plan.py
            tools/verify_release_gate.py
          persist-credentials: false
      - run: python3 target/verification-tools/tools/verify_release_gate.py --root . --gate tools
