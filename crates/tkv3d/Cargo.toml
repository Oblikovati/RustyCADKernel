[package]
autotests = false
name = "rustycad-tkv3d"
description = "OCCT TKV3d toolkit: selection, presentation, interactive objects and the 3D viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.6" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.6" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.6" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.6" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.6" }
rustycad-tkservice = { path = "../tkservice", version = "0.2.6" }
rustycad-tkmesh = { path = "../tkmesh", version = "0.2.6" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.2.6" }


rustycad-tkbrep = { path = "../tkbrep", version = "0.2.6" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.6" }

[[example]]
name = "rustycad-tkv3d-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Abort checks reexecute exact test names.
[[test]]
name = "ais_context_fatal"
path = "tests/ais_context_fatal.rs"

[dev-dependencies]
# Real closed volume fixtures reuse the existing Martensite primitive topology implementation.
rustycad-tkprim = { path = "../tkprim", version = "0.2.6" }
