[package]
autotests = false
name = "rustycad-tkmath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
num-complex = "=0.4.6"
rustc_apfloat = "=0.2.3"
rustycad-cmath = { path = "../cmath", version = "0.2.2" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.2" }

[features]
# Matches checks compiled into OCCT's out-of-line gp_Mat methods under OCCT_DEBUG.
occt-debug-checks = []

[dev-dependencies]
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.2" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.2" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.2" }
rustycad-tkprim = { path = "../tkprim", version = "0.2.2" }
rustycad-tkmesh = { path = "../tkmesh", version = "0.2.2" }

[[example]]
name = "rustycad-tkmath-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
