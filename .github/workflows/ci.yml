name: Rust
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo lint
      - run: cargo test-all
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo install cargo-nextest --version 0.9.146 --locked
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      - run: cargo coverage
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-and-tests
          path: |
            target/lcov.info
            target/nextest/ci/junit.xml
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - run: python3 tools/porting.py check --source target/occt-source
      - run: python3 tools/porting.py status
  tkernel-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - run: rustup show
      - run: PYTHONPATH=tools python3 -m unittest discover -s tools/tests
      - run: python3 tools/verify_tkernel.py --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKMath --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKG2d --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKGeomBase --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKBRep --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKGeomAlgo --source target/occt-source --jobs 2
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: tkernel-oracle-evidence
          path: |
            target/oracle-tkernel/
            target/oracle-tkmath/
