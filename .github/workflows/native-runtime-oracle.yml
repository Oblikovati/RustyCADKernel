name: Native runtime oracle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Oblikovati/Martensite
          ref: 2254483e14b35f82a838a316ef5121d6059de658
          path: target/document-access-sdk
      - name: Capture native Windows compiler inventory before baseline admission
        shell: pwsh
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          git config core.autocrlf false
          git checkout-index --force --all
          git -C target/document-access-sdk config core.autocrlf false
          git -C target/document-access-sdk checkout-index --force --all
          git config core.eol lf
          git -C target/document-access-sdk config core.eol lf
          python tools/diagnostics/prepare_windows_streams.py
          New-Item -ItemType Directory -Force target/runtime-oracle, target/windows-probe/src | Out-Null
          Copy-Item tools/diagnostics/windows_document_streams.rs target/windows-probe/src/main.rs
          $sdkPath = (Resolve-Path target/document-access-sdk/crates/martensite-tkernel).Path.Replace('\', '/')
          @"
          [package]
          name = "windows-document-stream-probe"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          martensite-tkernel = { path = "$sdkPath" }
          "@ | Set-Content target/windows-probe/Cargo.toml
          Copy-Item tools/diagnostics/windows_document_streams.lock target/windows-probe/Cargo.lock
          $fix = Get-Content tools/diagnostics/windows_document_streams_fix.json -Raw | ConvertFrom-Json
          $patch = (Resolve-Path tools/diagnostics/windows_document_streams_fix.patch).Path
          $patchHash = (Get-FileHash $patch).Hash.ToLowerInvariant()
          if ($patchHash -ne $fix.patch_sha256) { throw 'Fix patch hash mismatch' }
          git -C target/document-access-sdk apply --check $patch
          if ($LASTEXITCODE -ne 0) { throw 'Fix patch does not match exact candidate' }
          git -C target/document-access-sdk apply $patch
          if ($LASTEXITCODE -ne 0) { throw 'Fix patch application failed' }
          foreach ($file in $fix.files.PSObject.Properties) {
            $actual = (Get-FileHash (Join-Path target/document-access-sdk $file.Name)).Hash.ToLowerInvariant()
            if ($actual -ne $file.Value) { throw "Fixed source hash mismatch: $($file.Name)" }
          }
          Copy-Item tools/diagnostics/windows_document_streams_fix.json target/runtime-oracle/fix-manifest.json
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { throw "Rust installation failed: $LASTEXITCODE" }
          rustc +1.99.0 -Vv | Out-File target/runtime-oracle/rust-version.txt
          git rev-parse HEAD | Out-File target/runtime-oracle/source-revision.txt
          git -C target/document-access-sdk rev-parse HEAD | Out-File target/runtime-oracle/sdk-revision.txt
          Get-Volume | Format-List | Out-File target/runtime-oracle/volumes.txt
          Get-FileHash tools/diagnostics/windows_document_streams.rs, tools/diagnostics/windows_document_streams_fix.patch, tools/diagnostics/windows_document_streams_fix.json, tools/diagnostics/windows_document_streams.lock, .github/workflows/native-runtime-oracle.yml | Format-List | Out-File target/runtime-oracle/source-hashes.txt
          $env:RUSTUP_TOOLCHAIN = '1.99.0'
          $env:CARGO_BUILD_JOBS = '2'
          Push-Location target/document-access-sdk
          cargo +1.99.0 xtask pr --base 2254483e14b35f82a838a316ef5121d6059de658 2>&1 | Tee-Object ../runtime-oracle/native-compiler-inventory.log
          $inventoryExit = $LASTEXITCODE
          Pop-Location
          if ($inventoryExit -eq 0) { throw 'Expected a reviewed baseline delta before admission' }
          if (-not (Select-String -Path target/runtime-oracle/native-compiler-inventory.log -SimpleMatch 'compiler inventory changed for x86_64-pc-windows-msvc' -Quiet)) { throw 'Inventory did not reach its expected baseline comparison' }
          python tools/diagnostics/verify_windows_stream_inventory.py
          if ($LASTEXITCODE -ne 0) { throw 'Native inventory delta verification failed' }
          Copy-Item target/document-access-sdk/target/unsafe-inventory/latest.json target/runtime-oracle/compiler-inventory.json
          Copy-Item target/document-access-sdk/target/unsafe-inventory/compiler.stdout.jsonl target/runtime-oracle/compiler.stdout.jsonl
          Copy-Item target/document-access-sdk/target/unsafe-inventory/compiler.stderr.txt target/runtime-oracle/compiler.stderr.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: windows-document-stream-probe
          path: |
            target/runtime-oracle/*.json
            target/runtime-oracle/*.jsonl
            target/runtime-oracle/*.txt
            target/runtime-oracle/*.log
            target/windows-probe/Cargo.lock
          if-no-files-found: error
