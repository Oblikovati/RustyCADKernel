[workspace]
members = ["crates/cmath", "crates/kernel", "crates/parity", "crates/tkernel", "crates/tkmath", "crates/tkbrep", "crates/tktopalgo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
debug = "line-tables-only"
