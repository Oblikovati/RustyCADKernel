[package]
autotests = false
name = "rustycad-tklcaf"
description = "OCCT TKLCAF toolkit: the OCAF data framework (TDF labels and attributes, TDataStd, TFunction, TDocStd)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.6" }
rustycad-tkcdf = { path = "../tkcdf", version = "0.2.6" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
