[package]
autotests = false
name = "rustycad-tkcaf"
description = "OCCT TKCAF toolkit: topological naming (TNaming), the extended attributes (TDataXtd) and the standard application (AppStd)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.8" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.8" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.8" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.8" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.8" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.8" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.8" }
# TNaming::OuterWire classifies wires with IntTools_FClass2d (TKBO).
rustycad-tkbo = { path = "../tkbo", version = "0.2.8" }
rustycad-tkcdf = { path = "../tkcdf", version = "0.2.8" }
rustycad-tklcaf = { path = "../tklcaf", version = "0.2.8" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.2.8" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
