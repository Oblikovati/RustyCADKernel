[package]
autotests = false
name = "rustycad-tkgeomalgo"
description = "OCCT TKGeomAlgo toolkit: intersections, hatching, constraint solving, filling and plate algorithms on geometry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.5" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.5" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.5" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.5" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.5" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.5" }

[dev-dependencies]
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.5" }
rustycad-tkshhealing = { path = "../tkshhealing", version = "0.2.5" }

[[example]]
name = "rustycad-tkgeomalgo-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
