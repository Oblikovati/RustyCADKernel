name: Native platform geometry oracle
on:
  workflow_dispatch:
    inputs:
      capture:
        description: Geometry scope for the diagnostic capture
        type: choice
        options: ['geometry', 'cylinder', 'portable-cylinder']
        default: 'geometry'
      platforms:
        description: JSON runner list for the controlled capture
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      fp_contract:
        description: Native compiler floating-point contraction
        type: choice
        options: ['off', 'on', 'fast']
        default: 'off'
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  geometry:
    if: inputs.capture != 'portable-cylinder'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - name: Pin native build version abbreviation
        run: git -C target/occt-source config core.abbrev 10
      - name: Configure pinned native modeling dependencies
        run: >-
          cmake -S target/occt-source -B target/native-platform
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_LIBRARY_TYPE=Shared
          -DBUILD_MODULE_Visualization=OFF -DBUILD_MODULE_ApplicationFramework=OFF
          -DBUILD_MODULE_DataExchange=OFF -DBUILD_MODULE_Draw=OFF
          -DBUILD_GTEST=OFF -DUSE_TBB=OFF -DUSE_FREETYPE=OFF
          -DCMAKE_CXX_FLAGS="${{ runner.os == 'Windows' && '/fp:precise' || format('-ffp-contract={0}', inputs.fp_contract) }}"
      - name: Build native geometry toolkits
        run: cmake --build target/native-platform --config RelWithDebInfo --target ${{ inputs.capture == 'cylinder' && 'TKPrim TKMesh' || 'TKBO TKPrim TKMesh' }} --parallel 3
      - name: Capture native and Rust geometry independently
        env:
          MARTENSITE_FP_CONTRACT: ${{ inputs.fp_contract }}
          MARTENSITE_CYLINDER_ONLY: ${{ inputs.capture == 'cylinder' }}
        run: python3 tools/ci/capture_platform_geometry.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: geometry-oracle-${{ matrix.os }}
          path: |
            target/platform-geometry/*.expected
            target/platform-geometry/*.log
            target/platform-geometry/receipt.json
            target/native-platform/CMakeCache.txt

  portable-cylinder:
    if: inputs.capture == 'portable-cylinder'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            tools/diagnostics/mesh263
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oblikovati/Martensite
          ref: ab4bad4fce774001b192fd20ac4d7a9010e68fea
          path: target/mesh263-product
          persist-credentials: false
      - name: Preserve exact source bytes and install the pinned compiler
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --force --all
          git -C target/mesh263-product config core.autocrlf false
          git -C target/mesh263-product checkout-index --force --all
          rustup toolchain install 1.99.0 --profile minimal
      - name: Capture exact original failures and checked selector correction
        shell: bash
        run: python tools/diagnostics/mesh263/capture_contract.py target/mesh263-product target/mesh263-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portable-cylinder-${{ matrix.os }}
          path: |
            target/mesh263-results/*.json
            target/mesh263-results/*.log
            target/mesh263-results/probe/Cargo.lock
          if-no-files-found: error
