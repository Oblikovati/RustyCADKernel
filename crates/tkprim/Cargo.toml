[package]
autotests = false
name = "rustycad-tkprim"
description = "OCCT TKPrim toolkit: primitive solids (boxes, wedges, revolved bodies) and linear and rotational sweeps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.7" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.7" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.7" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.7" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.7" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.7" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.2.7" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.7" }

[[example]]
name = "rustycad-tkprim-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
