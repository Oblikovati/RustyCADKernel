[package]
autotests = false
name = "rustycad-tkmesh"
description = "OCCT TKMesh toolkit: discrete mesh models and meshing algorithms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.6" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.6" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.6" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.6" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.6" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.6" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.2.6" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.6" }
allocator-api2 = "0.4"
rustycad-tkshhealing = { path = "../tkshhealing", version = "0.2.6" }
[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.2.6" }

[[example]]
name = "rustycad-tkmesh-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Mutates the process-wide default meshing factory.
[[test]]
name = "brep_mesh_discret_algo_factory_legacy"
path = "tests/brep_mesh_discret_algo_factory_legacy.rs"
