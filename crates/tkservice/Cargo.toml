[package]
autotests = false
name = "rustycad-tkservice"
description = "OCCT TKService toolkit: visualization services (Aspect, Image, Font, Graphic3d, Media, Xw)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.5" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.5" }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[[example]]
name = "rustycad-tkservice-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
