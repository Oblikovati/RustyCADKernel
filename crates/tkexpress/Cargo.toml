[package]
autotests = false
name = "rustycad-tkexpress"
description = "OCCT TKExpress toolkit: symbolic expressions, relations, functions and the expression interpreter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-cmath = { path = "../cmath", version = "0.2.5" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.5" }

[[example]]
name = "rustycad-tkexpress-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
