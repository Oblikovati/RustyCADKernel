[package]
autotests = false
name = "martensite-vulkan"
description = "Martensite Vulkan 1.3 visualization renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
ash = "=0.38.0"
rustycad-tkernel = { path = "../tkernel", version = "0.2.0" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.0" }
rustycad-tkservice = { path = "../tkservice", version = "0.2.0" }

[dev-dependencies]
rustycad-tkv3d = { path = "../tkv3d", version = "0.2.0" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.0" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11-dl = "=2.21.0"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
