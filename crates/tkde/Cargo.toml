[package]
autotests = false
name = "rustycad-tkde"
description = "OCCT TKDE toolkit: the data exchange framework (configuration nodes, providers and the format registry DE_Wrapper)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.8" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.8" }
# TopAbs (TopAbs_ShapeEnum of DE_ShapeFixParameters) lives in TKG3d, below TKBRep.
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.8" }
# DE_Provider names TDocStd_Document (TKLCAF) through a forward declaration natively; the
# Rust signatures need the type itself (docs/de-design.md section 2).
rustycad-tklcaf = { path = "../tklcaf", version = "0.2.8" }

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
