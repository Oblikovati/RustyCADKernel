name: Release Martensite packages
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
# Match CI's bounded test artifact profile for the extracted archive checks.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  # XR replay on run38200556316 exposed CPU-dependent bilinear sampling.
  # The checked native GL and lavapipe fixtures share Gallivm's SSE2 profile.
  GALLIUM_OVERRIDE_CPU_CAPS: sse2
  LP_NATIVE_VECTOR_WIDTH: '128'
concurrency:
  group: martensite-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner-checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: owner-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: '[[ "$RELEASE_REF" == refs/tags/v* ]]'
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
          python3 tools/with_vulkan_validation.py --github-env "$GITHUB_ENV"
      - run: rustup show
      - run: python3 tools/run_tool_tests.py --jobs 2 --pattern 'test_release_*.py'
      - name: Package and test extracted crates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release_packages.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: martensite-release
          path: target/releases/${{ github.ref_name }}/*
          if-no-files-found: error
  publish:
    needs: package
    environment: kernel-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: martensite-release
          path: release
      - name: Verify artifacts and publish immutable owner release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; expected a new immutable release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Martensite $RELEASE_TAG" --generate-notes ./*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
