name: Release Martensite packages
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: martensite-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  owner-checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: owner-checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: '[[ "$RELEASE_REF" == refs/tags/v* ]]'
      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev mesa-vulkan-drivers vulkan-validationlayers
      - run: rustup show
      - run: python3 tools/run_tool_tests.py --jobs 2 --pattern 'test_release_*.py'
      - name: Package and test extracted crates
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/release_packages.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: martensite-release
          path: target/releases/${{ github.ref_name }}/*
          if-no-files-found: error
  publish:
    needs: package
    environment: kernel-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: martensite-release
          path: release
      - name: Verify artifacts and publish immutable owner release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; expected a new immutable release."
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Martensite $RELEASE_TAG" --generate-notes ./*
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest=false
