[package]
name = "rustycad-tkg2d"
description = "OCCT TKG2d toolkit: transient 2D geometry (Geom2d) and 2D curve adaptors (Adaptor2d, Geom2dAdaptor)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-cmath = { path = "../cmath" }
rustycad-tkernel = { path = "../tkernel" }
rustycad-tkmath = { path = "../tkmath" }

[dev-dependencies]
rustycad-tkgeombase = { path = "../tkgeombase" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo" }

[[example]]
name = "rustycad-tkg2d-numeric-probe"
path = "examples/numeric_probe.rs"
