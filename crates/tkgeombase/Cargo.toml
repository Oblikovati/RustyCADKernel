[package]
autotests = false
name = "rustycad-tkgeombase"
description = "OCCT TKGeomBase toolkit: construction of elementary geometry and the ModelingData geometry algorithms"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-cmath = { path = "../cmath", version = "0.2.8" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.8" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.8" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.8" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.8" }

[[example]]
name = "rustycad-tkgeombase-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Requires a fresh process-wide FEmTool reference cache.
[[test]]
name = "fem_tool_reference_cache"
path = "tests/fem_tool_reference_cache.rs"

# Requires a fresh process-wide FEmTool reference cache.
[[test]]
name = "app_def_reference_cache"
path = "tests/app_def_reference_cache.rs"
