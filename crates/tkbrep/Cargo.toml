[package]
autotests = false
name = "rustycad-tkbrep"
description = "OCCT TKBRep toolkit: the topological data structure (TopoDS), its exploration (TopExp) and tools (TopTools)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.1.1" }
rustycad-tkmath = { path = "../tkmath", version = "0.1.1" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.1.1" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.1.1" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.1.1" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.1.1" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.1.1" }

[[example]]
name = "rustycad-tkbrep-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
