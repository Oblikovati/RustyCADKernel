[package]
autotests = false
name = "rustycad-tkshhealing"
description = "OCCT TKShHealing toolkit: Shape Healing (analysis, fixing, conversion and division of shapes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.8" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.8" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.8" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.8" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.8" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.8" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.2.8" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.8" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.2.8" }

[[example]]
name = "rustycad-tkshhealing-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

# Initializes the process-wide ShapeExtend message catalog.
[[test]]
name = "shape_extend_messages"
path = "tests/shape_extend_messages.rs"

# Expects warning identifiers before the process-wide ShapeExtend catalog is initialized.
[[test]]
name = "shape_fix_face_orientation"
path = "tests/shape_fix_face_orientation.rs"

# Expects warning identifiers before the process-wide ShapeExtend catalog is initialized.
[[test]]
name = "shape_fix_wireframe_merge_branches"
path = "tests/shape_fix_wireframe_merge_branches.rs"
