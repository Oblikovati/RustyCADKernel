[package]
autotests = false
name = "rustycad-tkmath"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
num-bigint = { version = "=0.4.6", default-features = false }
num-complex = "=0.4.6"
rustc_apfloat = "=0.2.3"
rustycad-cmath = { path = "../cmath", version = "0.2.5" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.5" }

[features]
# Matches checks compiled into OCCT's out-of-line gp_Mat methods under OCCT_DEBUG.
occt-debug-checks = []

[dev-dependencies]
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.5" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.5" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.5" }
rustycad-tkprim = { path = "../tkprim", version = "0.2.5" }
rustycad-tkmesh = { path = "../tkmesh", version = "0.2.5" }

[[example]]
name = "rustycad-tkmath-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"

[[bench]]
name = "exact_roots"
path = "benches/exact_roots.rs"
harness = false

[[bench]]
name = "bezier_line"
path = "benches/bezier_line.rs"
harness = false

[[bench]]
name = "root_signs"
path = "benches/root_signs.rs"
harness = false

[[bench]]
name = "bezier_wire"
path = "benches/bezier_wire.rs"
harness = false

[[bench]]
name = "bezier_incidence"
path = "benches/bezier_incidence.rs"
harness = false

[[bench]]
name = "captured_winding"
path = "benches/captured_winding.rs"
harness = false

[[bench]]
name = "metric_bounds"
path = "benches/metric_bounds.rs"
harness = false
