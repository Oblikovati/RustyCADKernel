name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# Toolkit suites share test executables; symbols and incremental caches are unnecessary in CI.
# These settings keep debug assertions and optimization levels unchanged.
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  # LLVM merges counters into four files per binary rather than one file per process.
  LLVM_PROFILE_FILE_NAME: martensite-%4m.profraw
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev
      - name: Install macOS native prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf tcl-tk@8 freetype fontconfig
          tcl_prefix="$(brew --prefix tcl-tk@8)"
          shim_dir="$RUNNER_TEMP/martensite-pkgconfig"
          mkdir -p "$shim_dir"
          for module in tcl tk; do
            pc_file="$tcl_prefix/lib/pkgconfig/$module.pc"
            if [ ! -f "$pc_file" ]; then pc_file="$tcl_prefix/lib/pkgconfig/${module}8.6.pc"; fi
            cp "$pc_file" "$shim_dir/${module}8.6.pc"
          done
          echo "PKG_CONFIG_PATH=$shim_dir:$tcl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$tcl_prefix/lib:$(brew --prefix freetype)/lib:$(brew --prefix fontconfig)/lib" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$shim_dir:$tcl_prefix/lib/pkgconfig" pkg-config --modversion tcl8.6 tk8.6
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: tcltk/tcl
          ref: 515167c897a7c8066abfbd71e8fe7bd8bf3569de # Tcl 8.6.18
          path: target/tcl-source
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: tcltk/tk
          ref: 6dbe68819aac4a22f6f7a143133ce26c5e8d2b05 # Tk 8.6.18
          path: target/tk-source
      - name: Install Windows Tcl/Tk prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/install_windows_tcl.ps1
      - uses: actions/checkout@v7.0.1
        if: runner.os == 'Windows'
        with:
          repository: freetype/freetype
          ref: 42608f77f20749dd6ddc9e0536788eaad70ea4b5 # FreeType 2.13.3
          path: target/freetype-source
      - name: Install Windows FreeType prerequisite
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/install_windows_freetype.ps1
      - run: rustup show
      - run: python3 tools/toolkit_test_suites.py
      - run: python3 tools/check_rust_format.py
      - run: cargo lint
      - name: Test every toolkit (including doctests)
        run: cargo test-all --no-fail-fast
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  coverage:
    runs-on: ubuntu-latest
    steps:
      # Leave space for instrumented toolkits and the source-built coverage tools.
      - name: Free unused hosted SDKs for instrumented tests
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@v7.0.1
      - name: Install native coverage prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev
      - run: rustup show
      - run: cargo install cargo-nextest --version 0.9.146 --locked
      - run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run instrumented tests once, with coverage and JUnit output
        run: cargo llvm-cov nextest --workspace --all-features --locked --profile ci --lcov --output-path target/lcov.info
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-and-tests
          path: |
            target/lcov.info
            target/llvm-cov-target/nextest/ci/junit.xml
  vulkan-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools xvfb xauth
      - run: cargo test -p martensite-vulkan --all-targets --locked
      - name: Select the installed software Vulkan ICD
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
      - run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p martensite-vulkan --example offscreen_acceptance --locked
      - name: Validate opaque lighting and clipped lighting on lavapipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p martensite-vulkan --example lighting_acceptance --locked
      - name: Validate every checked-in Vulkan shader variant
        run: |
          for shader in crates/vulkan/shaders/*.spv; do
            spirv-val --target-env vulkan1.3 "$shader"
          done
      - name: Measure release renderer performance on lavapipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p martensite-vulkan --release --example renderer_performance --locked > target/renderer-performance.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lavapipe-renderer-performance
          path: target/renderer-performance.log
      - run: glslangValidator --target-env vulkan1.3 -V crates/vulkan/shaders/unlit.vert -o /tmp/unlit.vert.spv
      - run: spirv-val --target-env vulkan1.3 crates/vulkan/shaders/unlit.vert.spv
      - run: glslangValidator --target-env vulkan1.3 -V crates/vulkan/shaders/unlit.frag -o /tmp/unlit.frag.spv
      - run: spirv-val --target-env vulkan1.3 crates/vulkan/shaders/unlit.frag.spv
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - run: python3 tools/porting.py check --source target/occt-source
      - run: python3 tools/porting.py status
  tkernel-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - run: rustup show
      - run: python3 tools/run_tool_tests.py --jobs 2
      # OCCT embeds git rev-parse --short; match the pinned ten-digit version literal.
      - run: git -C target/occt-source config core.abbrev 10
      - run: python3 tools/verify_tkernel.py --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKMath --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKG2d --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKGeomBase --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKBRep --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKGeomAlgo --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKTopAlgo --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKHelix --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKShHealing --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKPrim --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKHLR --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKFillet --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKBool --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKCDF --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKLCAF --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKCAF --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKDE --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKXSBase --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKExpress --source target/occt-source --jobs 2
      - run: sudo apt-get install -y libfreetype-dev libfontconfig-dev libx11-dev
      - run: python3 tools/verify_toolkit.py TKService --source target/occt-source --jobs 2
      - run: python3 tools/verify_toolkit.py TKV3d --source target/occt-source --jobs 2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tkernel-oracle-evidence
          path: |
            target/oracle-tkernel/
            target/oracle-tkmath/
