[package]
autotests = false
name = "rustycad-tkg3d"
description = "OCCT TKG3d toolkit: transient 3D geometry (Geom)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-cmath = { path = "../cmath", version = "0.2.5" }
rustycad-tkernel = { path = "../tkernel", version = "0.2.5" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.5" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.5" }

[[example]]
name = "rustycad-tkg3d-numeric-probe"
path = "examples/numeric_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
