name: Native platform geometry oracle
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  cpu-pipe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact product compiler
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Independent native probes and unchanged product tests
        run: python3 tools/ci/capture_macos_cpu_pipe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos-cpu-pipe-${{ matrix.runner }}
          path: |
            target/macos-cpu-pipe/*.log
            target/macos-cpu-pipe/receipt.json
