[package]
name = "rustycad-tkhlr"
description = "OCCT TKHLR toolkit: hidden line removal, contour lines and interval sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.1.1" }
rustycad-tkmath = { path = "../tkmath", version = "0.1.1" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.1.1" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.1.1" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.1.1" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.1.1" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.1.1" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.1.1" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim", version = "0.1.1" }

[[example]]
name = "rustycad-tkhlr-numeric-probe"
path = "examples/numeric_probe.rs"

[[example]]
name = "rustycad-tkhlr-contour-private-probe"
path = "examples/contour_private_probe.rs"
