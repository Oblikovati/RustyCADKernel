[package]
name = "rustycad-tkdraw"
description = "OCCT TKDraw toolkit: the DRAW test harness (Tcl interpreter, variables, drawables, DBRep, DrawTrSurf)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tcl = { path = "../tcl", version = "0.1.1" }
rustycad-tkernel = { path = "../tkernel", version = "0.1.1" }
rustycad-tkmath = { path = "../tkmath", version = "0.1.1" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.1.1" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.1.1" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.1.1" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.1.1" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.1.1" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.1.1" }
rustycad-tkhlr = { path = "../tkhlr", version = "0.1.1" }
rustycad-tkmesh = { path = "../tkmesh", version = "0.1.1" }
# The stream capture of the command log redirects descriptors with dup/dup2 (C library).
libc = "=0.2.189"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }
