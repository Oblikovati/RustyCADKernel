[package]
name = "rustycad-tktopalgo"
description = "OCCT TKTopAlgo toolkit: topological algorithms (classification, construction, checking, extrema and properties of shapes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel" }
rustycad-tkmath = { path = "../tkmath" }
rustycad-tkg2d = { path = "../tkg2d" }
rustycad-tkg3d = { path = "../tkg3d" }
rustycad-tkgeombase = { path = "../tkgeombase" }
rustycad-tkbrep = { path = "../tkbrep" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo" }

[dev-dependencies]
rustycad-tkprim = { path = "../tkprim" }

[[example]]
name = "rustycad-tktopalgo-numeric-probe"
path = "examples/numeric_probe.rs"
