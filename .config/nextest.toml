[profile.default]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci]
retries = 0

[profile.ci.junit]
path = "junit.xml"

# Exhaustive checkpoint-cancellation tests replay every callback of the owned
# sketch-region operations; under coverage instrumentation on a loaded host they
# exceed five minutes. They keep every assertion and only get a longer limit.
[[profile.default.overrides]]
filter = "package(rustycad-tkbo) & test(/::every_/)"
slow-timeout = { period = "60s", terminate-after = 20 }

# The native offset-incidence corpora isolate every contact of the Go fit-spline
# offsets exactly; under coverage instrumentation on hosted runners they exceed
# five minutes. They keep every assertion and only get a longer limit.
[[profile.default.overrides]]
filter = "package(rustycad-tkgeomalgo) & test(/sketch_line_incidences::native_offsets::/)"
slow-timeout = { period = "60s", terminate-after = 20 }
