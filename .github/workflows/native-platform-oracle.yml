name: Native platform geometry oracle
on:
  workflow_dispatch:
    inputs:
      capture:
        description: Geometry scope for the diagnostic capture
        type: choice
        options: ['geometry', 'cylinder']
        default: 'geometry'
      platforms:
        description: JSON runner list for the controlled capture
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      fp_contract:
        description: Native compiler floating-point contraction
        type: choice
        options: ['off', 'on', 'fast']
        default: 'off'
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
jobs:
  geometry:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: 3d097a0328e71b826377d4814ab05ec3c3d23871
          path: target/occt-source
      - name: Pin native build version abbreviation
        run: git -C target/occt-source config core.abbrev 10
      - name: Configure pinned native modeling dependencies
        run: >-
          cmake -S target/occt-source -B target/native-platform
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_LIBRARY_TYPE=Shared
          -DBUILD_MODULE_Visualization=OFF -DBUILD_MODULE_ApplicationFramework=OFF
          -DBUILD_MODULE_DataExchange=OFF -DBUILD_MODULE_Draw=OFF
          -DBUILD_GTEST=OFF -DUSE_TBB=OFF -DUSE_FREETYPE=OFF
          -DCMAKE_CXX_FLAGS="${{ runner.os == 'Windows' && '/fp:precise' || format('-ffp-contract={0}', inputs.fp_contract) }}"
      - name: Build native geometry toolkits
        run: cmake --build target/native-platform --config RelWithDebInfo --target ${{ inputs.capture == 'cylinder' && 'TKPrim TKMesh' || 'TKBO TKPrim TKMesh' }} --parallel 3
      - name: Capture native and Rust geometry independently
        env:
          MARTENSITE_FP_CONTRACT: ${{ inputs.fp_contract }}
          MARTENSITE_CYLINDER_ONLY: ${{ inputs.capture == 'cylinder' }}
        run: python3 tools/ci/capture_platform_geometry.py
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: geometry-oracle-${{ matrix.os }}
          path: |
            target/platform-geometry/*.expected
            target/platform-geometry/*.log
            target/platform-geometry/receipt.json
            target/native-platform/CMakeCache.txt
