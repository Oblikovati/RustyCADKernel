[package]
autotests = false
name = "rustycad-tkbo"
description = "OCCT TKBO toolkit: Boolean operation and intersection foundations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rustycad-tkernel = { path = "../tkernel", version = "0.2.7" }
rustycad-tkmath = { path = "../tkmath", version = "0.2.7" }
rustycad-tkg3d = { path = "../tkg3d", version = "0.2.7" }
rustycad-tkbrep = { path = "../tkbrep", version = "0.2.7" }
rustycad-tkg2d = { path = "../tkg2d", version = "0.2.7" }
rustycad-tkgeomalgo = { path = "../tkgeomalgo", version = "0.2.7" }
rustycad-tkgeombase = { path = "../tkgeombase", version = "0.2.7" }
rustycad-tktopalgo = { path = "../tktopalgo", version = "0.2.7" }
# Native TKBO links TKPrim: BOPAlgo_MakerVolume bounds the faces with a BRepPrimAPI_MakeBox.
rustycad-tkprim = { path = "../tkprim", version = "0.2.7" }
# Native TKBO links TKShHealing: ShapeUpgrade_UnifySameDomain merges the edges and faces of
# one material (BOPAlgo_CellsBuilder), simplifies Boolean results and defeatured shapes.
rustycad-tkshhealing = { path = "../tkshhealing", version = "0.2.7" }

[[example]]
name = "rustycad-tkbo-numeric-probe"
path = "examples/numeric_probe.rs"
[dev-dependencies]
# The blend fixtures of the fuse GTests (BOPTest_Utilities::CreateBlend).
rustycad-tkfillet = { path = "../tkfillet", version = "0.2.7" }
rustycad-tkmesh = { path = "../tkmesh", version = "0.2.7" }
static_assertions = "1.1.0"

[[example]]
name = "rustycad-tkbo-edge-private-probe"
path = "examples/edge_private_probe.rs"

[[example]]
name = "rustycad-tkbo-bean-private-probe"
path = "examples/bean_private_probe.rs"

# Test modules share one executable per toolkit to avoid repeated linkage.
[[test]]
name = "toolkit"
path = "tests/toolkit.rs"
