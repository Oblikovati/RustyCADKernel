[workspace]
members = ["crates/cmath", "crates/kernel", "crates/parity", "crates/tkernel", "crates/tkmath", "crates/tkg2d", "crates/tkg3d", "crates/tkgeombase", "crates/tkbrep", "crates/tkgeomalgo", "crates/tktopalgo", "crates/tkoffset",
  "crates/tkhelix",
  "crates/tkexpress",
  "crates/tkshhealing",
  "crates/tkprim",
  "crates/tkhlr",
  "crates/tkbo",
  "crates/tkmesh",
  "crates/tkfillet",
  "crates/tkbool",
  "crates/tkcdf",
  "crates/tklcaf",
  "crates/tkcaf",
  "crates/tkde",
  "crates/tkxsbase",
  "crates/tcl",
  "crates/tkdraw",
  "crates/tkservice",
  "crates/tkv3d",
  "crates/vulkan",
  "crates/tkmeshvs",
  "crates/tkvcaf",
]
resolver = "3"

[workspace.package]
version = "0.2.8"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-2.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
debug = "line-tables-only"
