name: Martensite v0.2.4 source versus archive diagnostics
on:
  push:
    branches: [diagnostics/release-0.2.4-source-archives]
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  GALLIUM_OVERRIDE_CPU_CAPS: sse2
  LP_NATIVE_VECTOR_WIDTH: '128'
  MARTENSITE_DIAGNOSTIC_REVISION: 4c884b0e01435243f4c23ee7eda93aaff9029641
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # Tooling is separate so both tested roots retain the immutable release source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostic-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 4c884b0e01435243f4c23ee7eda93aaff9029641
          path: kernel
      # Match release.yml package prerequisites; vulkan-tools is observation-only.
      # No DISPLAY, extra font installation or forced device index masks the archive context.
      - name: Install the package-job dependencies for both cohorts
        working-directory: kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config tcl8.6-dev tk8.6-dev libfreetype-dev libfontconfig-dev libx11-dev libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
          python3 tools/with_vulkan_validation.py --github-env "$GITHUB_ENV"
      - name: Retain strict source and extracted-package verdicts on one runner
        run: |
          python3 diagnostic-tools/tools/diagnose_source_archives.py --root kernel --output diagnostic-output --revision "$MARTENSITE_DIAGNOSTIC_REVISION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-0.2.4-source-archive-diagnostics
          path: |
            diagnostic-output/source
            diagnostic-output/stage
            diagnostic-output/source-stage-comparison.json
